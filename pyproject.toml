[project]
name = "wp-todo"
version = "0.1.0"
description = "A prioritised TODO list of de.wikipedia articles that likely need updating"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.optional-dependencies]
# Only needed for `wp-todo research --agent`. Everything else - the worklist,
# and the deterministic half of a dossier - runs without it and costs nothing,
# so the SDK is not a hard dependency of the tool.
agent = ["anthropic>=1.2,<2", "pypdf>=5.1"]

# Text extraction from PDF references. Its own extra because it is useful
# without a model: the Swiss statistical offices this scope leans on publish
# PDF, and a reference that cannot be read is a finding nobody gets to make.
pdf = ["pypdf>=5.1"]

[project.scripts]
wp-todo = "wp_todo.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wp_todo"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The multiplication sign is deliberate in the rendered German output.
"src/wp_todo/render.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Optional extra, imported behind an ImportError guard in `llm.py`. A dev
# install without `--extra agent` must still typecheck, or the checks stop
# matching what a contributor runs.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
