weight = 12.0
requires_year = true
year_window = 60

[[scoring.markers]]
code = "seit_year"
pattern = 'seit\s+(?P<year>(?:19|20)\d{2})'
max_age_years = 8
weight = 6.0
requires_year = true
year_window = 60

[[scoring.markers]]
code = "derzeit"
pattern = '\b(?:derzeit|zurzeit|aktuell|gegenwärtig|momentan)\b'
max_age_years = 5
weight = 8.0
requires_year = true
year_window = 60

[scoring.pageviews]
