# ------------------------------------------------------------------ category
# Walked with list=categorymembers, depth levels down. Keep depth small: the
# tree widens fast and every level costs requests.

# [[category]]
# name = "Kategorie:Verkehr (Kanton Zürich)"
# depth = 2

# --------------------------------------------------------------------- filter
[exclude]
titles = []
title_patterns = [
    '^Liste ',
    '\(Begriffsklärung\)$',
    '^\d{1,4}$',              # Jahresartikel
    '^\d{1,2}\. (Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)$',
]
category_patterns = [
    'Kategorie:Wikipedia:Begriffsklärung',
]

# -------------------------------------------------------------------- scoring
[scoring]
unknown_maintenance_weight = 0.0
veraltet_seit_bonus_per_year = 3.0
veraltet_seit_bonus_cap = 30.0

# Tuned against the first full run (790 articles). The signal applies to almost
# every article, so a high weight buries the 22 articles an editor has actually
# flagged. Dropping 40 -> 20 moved those from 11 to 15 of the visible top 50.
edit_age_weight = 20.0
edit_age_half_life_days = 900.0
# A revision changing fewer bytes than this is trivial, not substantive.
substantive_min_bytes = 100
history_depth = 50

marker_cap = 30.0

# Matched as a prefix against every category on the article, hidden or not.
# Longest matching prefix wins, so the dated Veraltet families outrank the plain
# one. Note that "Kategorie:Wikipedia:Veraltet seit YYYY" is NOT a hidden
# category, which is why categories are fetched unfiltered.
[scoring.maintenance]
"Kategorie:Wikipedia:Veraltet seit" = 60.0
"Kategorie:Wikipedia:Veraltet nach" = 45.0
"Kategorie:Wikipedia:Veraltet in" = 15.0
"Kategorie:Wikipedia:Veraltet" = 50.0
"Kategorie:Wikipedia:Lückenhaft" = 25.0
"Kategorie:Wikipedia:Überarbeiten" = 25.0
"Kategorie:Wikipedia:Neutralität" = 12.0
"Kategorie:Wikipedia:Belege fehlen" = 15.0
"Kategorie:Wikipedia:Qualitätssicherung" = 10.0
"Kategorie:Wikipedia:Redundanz" = 8.0
# Dead-link bookkeeping dominates the raw counts in this region and is mostly
# bot-generated. Deliberately weighted near zero so it cannot drive the ranking.
"Kategorie:Wikipedia:Weblink offline IABot" = 1.0
"Kategorie:Wikipedia:Weblink offline fix-attempted" = 1.0
"Kategorie:Wikipedia:Weblink offline" = 4.0
"Kategorie:Wikipedia:Defekte Weblinks" = 1.0

[[scoring.markers]]
code = "stand_year"
pattern = 'Stand:?\s*(?:[A-Za-zä.]+\s+)?(?P<year>(?:19|20)\d{2})'
max_age_years = 3
weight = 12.0

# Removed after the first full run: "seit YYYY" fired on 244 of 790 articles and
# every sample was historical prose - "seit 1928 alljährlich", "Seit der
# Streckeneröffnung im Jahre 1954". For 189 of them it was the *only* marker, so
# the worklist offered a historical fact as its reason for calling the article
# stale. German "seit YYYY" is overwhelmingly a statement about the past, not a
# claim about the present. Re-enable if you find a formulation that separates
# the two:
#
# [[scoring.markers]]
# code = "seit_year"
# pattern = 'seit\s+(?P<year>(?:19|20)\d{2})'
# max_age_years = 8
# weight = 6.0

[[scoring.markers]]
code = "derzeit"
pattern = '\b(?:derzeit|zurzeit|aktuell|gegenwärtig|momentan)\b'
max_age_years = 5
weight = 8.0
requires_year = true

[scoring.pageviews]
months = 12
pivot = 500.0
strength = 0.5
max_multiplier = 3.0
access = "all-access"
# Excludes spiders and other automated traffic: about 19% of raw views on a
# sample article, and skewed towards exactly the pages bots crawl hardest.
agent = "user"

# Der Recherche-Schritt: `wp-todo research "<Titel>"`. Opt-in pro Artikel und
# absichtlich nicht Teil des wöchentlichen Laufs - er liest Hosts ausserhalb
# von Wikimedia, die niemand darum gebeten hat.
[research]
# Anfragen an Hosts ausserhalb von Wikimedia, pro Lauf. Harte Grenze.
max_fetches = 60
# Sekunden zwischen zwei Anfragen *an denselben Host*. Hosts werden getrennt
# getaktet: die Höflichkeitspause bei einem ist kein Freibrief beim nächsten.
delay_s = 2.0
timeout_s = 20.0
max_doc_bytes = 2_000_000
# robots.txt zu beachten ist die Voreinstellung; das Abschalten muss jemand
# hier hinschreiben.
respect_robots = true
compare_wikidata = true
compare_languages = ["en", "fr", "it"]

# --- Der Recherche-Agent. Nur aktiv mit `--agent`; ohne das Flag wird kein
# Modell befragt und der Lauf kostet nichts.
#
# Absichtlich knapp bemessen: der Nutzen kommt daher, dass die Belege des
# Artikels selbst gelesen werden - das sind eine Handvoll Fragen, kein
# Erkunden. Wenn das Budget nicht reicht, steht das im Dossier; es wird nichts
# stillschweigend weggelassen.
model = "claude-opus-5"
effort = "medium"
max_llm_calls = 10
max_claims = 5
max_reference_docs = 8
max_search_docs = 6
# Eine Angabe von letztem Jahr ist keine Neuigkeit.
stale_after_years = 2
