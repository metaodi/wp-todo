name: Verify assumptions

# Phase 0 discovery gate. Runs the read-only probe against the live
# de.wikipedia API from a GitHub runner, because a sandboxed development
# session has no egress to Wikimedia hosts.
#
# The probe cannot write to any wiki: it only issues GET requests against
# action=query, action=paraminfo and the pageviews REST endpoint.

on:
  workflow_dispatch:
    inputs:
      probes:
        description: 'Probes to run: "all", or a comma-separated subset e.g. P1,P4'
        required: false
        default: all
      contact:
        description: 'Contact string for the User-Agent (defaults to this repo URL)'
        required: false
        default: ''
      commit_results:
        description: 'Commit the probe output back to the branch'
        type: boolean
        required: false
        default: true

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build probe arguments
        id: args
        run: |
          if [ "${{ inputs.probes }}" = "all" ] || [ -z "${{ inputs.probes }}" ]; then
            echo "only=" >> "$GITHUB_OUTPUT"
          else
            args=""
            IFS=',' read -ra parts <<< "${{ inputs.probes }}"
            for p in "${parts[@]}"; do
              args="$args --only $(echo "$p" | tr -d '[:space:]')"
            done
            echo "only=$args" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the Phase 0 probe
        env:
          # Wikimedia's User-Agent policy accepts a project URL as contact
          # information; no personal address needs to leave the runner.
          WP_TODO_CONTACT: ${{ inputs.contact != '' && inputs.contact || format('https://github.com/{0}', github.repository) }}
          WP_TODO_DELAY_S: '1.0'
        run: |
          mkdir -p docs
          python3 scripts/phase0_probe.py ${{ steps.args.outputs.only }}

      - name: Publish the answer sheet to the job summary
        if: always()
        run: |
          if [ -f docs/phase0-probe-summary.md ]; then
            cat docs/phase0-probe-summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Phase 0 answer sheet"
            cat docs/phase0-probe-summary.md
            echo "::endgroup::"
          else
            echo "No summary produced - the probe did not get far enough." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-probe-raw
          path: |
            docs/phase0-probe-output.json
            docs/phase0-probe-summary.md
          retention-days: 90
          if-no-files-found: warn

      - name: Commit results
        if: ${{ inputs.commit_results }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f docs/phase0-probe-summary.md

          # The raw dump is committed only when it stays reviewable in a diff;
          # otherwise the artifact is the record.
          size=$(stat -c%s docs/phase0-probe-output.json 2>/dev/null || echo 0)
          echo "raw output size: ${size} bytes"
          if [ "$size" -gt 0 ] && [ "$size" -le 1048576 ]; then
            git add -f docs/phase0-probe-output.json
          else
            echo "raw output not committed (empty, or larger than 1 MiB) - see the phase0-probe-raw artifact"
          fi

          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: record phase 0 probe results from the live API"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:"${{ github.ref_name }}"; then
                exit 0
              fi
              echo "push failed (attempt ${attempt}), refreshing and retrying"
              sleep $((2 ** attempt))
              git pull --rebase origin "${{ github.ref_name }}" || true
            done
            echo "::error::could not push probe results"
            exit 1
          fi
