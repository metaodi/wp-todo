name: Research an article

# Builds a research dossier for one de.wikipedia article and commits it.
#
# Read-only against Wikipedia, like everything else here: the CLI can only
# issue GETs against the action-API allowlist and the Wikibase REST endpoint.
# The dossier is a briefing for a human to check, never an edit and never a
# draft - see docs/research-policy.md.
#
# Never scheduled. This stage costs requests to hosts that did not ask to be
# read, so it runs when somebody asks for it.

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Article title, exactly as on de.wikipedia (e.g. "Küsnachter Dorfbach")'
        required: true
        type: string
      refresh:
        description: "Bypass the response cache and re-ask the API"
        type: boolean
        required: false
        default: false
      commit:
        description: "Commit the dossier to research/"
        type: boolean
        required: false
        default: true
      agent:
        description: "Also ask a language model (costs money; needs ANTHROPIC_API_KEY)"
        type: boolean
        required: false
        default: false

concurrency:
  # Keyed on the *title*, not just the branch. `cancel-in-progress: false`
  # protects the running job, but GitHub keeps only one pending run per group:
  # dispatching several titles in a row silently cancelled the middle ones.
  # Observed - a "St. Josef (Horgen)" run was cancelled with no output.
  #
  # Two different articles have no reason to block each other, and the push
  # step already retries with a rebase, so concurrent pushes are handled.
  # Re-running the *same* title still serialises, which is what matters.
  group: research-${{ github.ref }}-${{ inputs.title }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # setup-uv publishes no moving major tag past v7; pin the exact release.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # The Anthropic SDK is an optional extra: without --agent it is never
      # imported, and installing it here costs a few seconds either way.
      - run: uv sync --frozen --dev --extra agent

      # Shared with the weekly refresh, so a title already in the corpus costs
      # almost nothing to research.
      - name: Restore response cache
        uses: actions/cache@v6
        with:
          path: cache/http
          key: wp-todo-http-${{ github.run_id }}
          restore-keys: wp-todo-http-

      # The title is arbitrary user input. It reaches the shell as an
      # environment variable and never as a `${{ }}` interpolation inside the
      # script: a title of `"; rm -rf . #` would otherwise execute.
      - name: Build the dossier
        id: research
        env:
          TITLE: ${{ inputs.title }}
          REFRESH: ${{ inputs.refresh }}
          AGENT: ${{ inputs.agent }}
          # Only read when --agent is passed. An unset secret is an empty
          # string, which the step below turns into a clear refusal rather
          # than a run that quietly does less than was asked.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Wikimedia User-Agent policy accepts a project URL as contact
          # information; no personal address needs to leave the runner.
          WP_TODO_CONTACT: ${{ format('https://github.com/{0}', github.repository) }}
        run: |
          set -euo pipefail
          args=()
          if [ "$REFRESH" = "true" ]; then
            args+=(--refresh)
          fi
          if [ "$AGENT" = "true" ]; then
            if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
              echo "::error::the agent was requested but ANTHROPIC_API_KEY is not set in this repository's secrets"
              exit 1
            fi
            args+=(--agent)
          fi
          # The status is captured rather than allowed to abort the step. The
          # CLI writes the deterministic dossier and *then* exits non-zero when
          # the optional agent stage failed, so aborting here would discard an
          # artefact that a run against Wikimedia has already paid for - which
          # is exactly what run #14 did with nine requests' worth of work.
          # The job still goes red: the status is re-raised at the end.
          status=0
          uv run wp-todo research "$TITLE" "${args[@]}" || status=$?

          # The CLI names the file it wrote; find it the same way rather than
          # re-deriving the slug here and risking a mismatch.
          # `*.transcript.md` also matches `*.md`, and it is written first,
          # so exclude it explicitly rather than relying on mtime order.
          # `|| true` because a failed glob would otherwise trip `pipefail`
          # before the clearer message below ever runs.
          dossier=$(ls -t research/*.md 2>/dev/null | grep -v '\.transcript\.md$' | head -1 || true)
          if [ -n "$dossier" ]; then
            echo "path=$dossier" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "::error::no dossier was produced"
            status=1
          fi
          exit "$status"

      - name: Publish the dossier to the job summary
        if: ${{ always() && steps.research.outputs.path != '' }}
        env:
          DOSSIER: ${{ steps.research.outputs.path }}
        run: cat "$DOSSIER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dossier
        if: ${{ always() && steps.research.outputs.path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: research-dossier
          path: research/
          retention-days: 90
          if-no-files-found: warn

      # The summary and the artifact above run on a failed build too, so a
      # dossier whose agent died is still readable. Committing one is a
      # different matter: `research/` is public and a dossier that says
      # "abgebrochen" belongs in a red run's artifact, not in the history.
      - name: Commit the dossier
        if: ${{ inputs.commit && steps.research.outcome == 'success' && steps.research.outputs.path != '' }}
        env:
          TITLE: ${{ inputs.title }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research
          if git diff --cached --quiet; then
            echo "dossier unchanged"
            exit 0
          fi

          # The title goes in through a file, not through the command line, so
          # the same rule that governs the run step governs the message.
          printf 'docs(research): dossier for %s\n' "$TITLE" > /tmp/commit-msg
          git commit -F /tmp/commit-msg

          for attempt in 1 2 3 4; do
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}), refreshing and retrying"
            sleep $((2 ** attempt))
            git pull --rebase origin "$BRANCH" || true
          done
          echo "::error::could not push the dossier"
          exit 1
