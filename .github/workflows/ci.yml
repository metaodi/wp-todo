name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag past v7; pin the exact release.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --dev

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # The suite must never reach the network: it runs against recorded
      # fixtures with an offline client, and a missing fixture is an error.
      - name: pytest
        run: uv run pytest
